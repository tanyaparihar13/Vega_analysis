# Vega Analysis — Nginx vhost.
#
#   sudo cp deploy/nginx-vega.conf /etc/nginx/sites-available/vega
#   sudo ln -sf /etc/nginx/sites-available/vega /etc/nginx/sites-enabled/vega
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vegaanalysis.com -d www.vegaanalysis.com
#
# ===========================================================================
# NGINX IS MANDATORY, NOT OPTIONAL.
# ===========================================================================
# The backend has no express.static — it serves API routes only. Nothing else
# serves the SPA.
#
# SAME ORIGIN IS A HARD REQUIREMENT. The client's axios instance uses a relative
# `/api`, and marketSocket.js builds `wss://<current host>/ws/market`. Neither is
# configurable at build time (the client reads zero import.meta.env values), so
# the SPA, the API and the WebSocket MUST be served from one origin. This is why
# /api and /ws are proxied here rather than the frontend pointing at
# api.vegaanalysis.com.

upstream vega_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vegaanalysis.com www.vegaanalysis.com;

    # certbot rewrites this to a 301 -> https and adds the TLS server block.
    root /var/www/vega-analysis/client/dist;
    index index.html;

    access_log /var/log/nginx/vega-access.log;
    error_log  /var/log/nginx/vega-error.log;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://vega_api;
        proxy_http_version 1.1;

        # app.set('trust proxy', 1) reads exactly one hop from these, so the
        # rate limiter buckets per real client IP instead of counting the whole
        # internet as 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The Excel export builds in-process and can take a few seconds on a
        # full session.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ---- WebSocket ---------------------------------------------------------
    location /ws/ {
        proxy_pass http://vega_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app's own heartbeat is 30s (HEARTBEAT_INTERVAL_MS), so Nginx's
        # 60s default would usually hold — but a quiet pre-open session has
        # nothing but pings, and a dropped socket there means the vega stream
        # silently stops. 1 hour is comfortably clear of it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- SPA ---------------------------------------------------------------
    # Hashed asset filenames are immutable; index.html must never be cached or
    # a deploy leaves browsers on the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
