<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vega Analysis | Professional Options Vega Analytics</title>
    <meta
      name="description"
      content="Professional Vega analytics for NSE and BSE index options. Call and Put vega tracked against the day-open baseline every market minute on a direct Zerodha Kite feed."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter + JetBrains Mono are the APP's faces and must stay.
      Playfair Display is added for the public marketing site's headings only
      (font-display). `display=swap` keeps first paint unblocked, and the
      preconnects above mean the request is already warm.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- YouTube facades load their thumbnails from here; warming the origin
         shaves the visible pop-in on the Learning section. -->
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  </head>
  <body class="bg-vega-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
